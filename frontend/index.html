<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaDoc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f9f8f5;
    --border: #e4e2db; --border2: #d0cdc4;
    --ink: #1a1916; --ink2: #6b6860; --ink3: #a8a69f;
    --navy: #0f2040; --accent: #2563eb; --accent-soft: #eff4ff;
    --green: #166534; --green-bg: #f0fdf4; --green-border: #bbf7d0;
    --red: #991b1b; --red-bg: #fef2f2; --red-border: #fecaca;
    --amber: #92400e; --amber-bg: #fffbeb; --amber-border: #fde68a;
    --r: 12px; --r-sm: 8px;
    --shadow: 0 1px 3px rgba(26,25,22,.06), 0 4px 16px rgba(26,25,22,.04);
    --shadow-md: 0 2px 8px rgba(26,25,22,.08), 0 8px 32px rgba(26,25,22,.06);
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  #app { display: flex; height: 100vh; overflow: hidden; flex-direction: column; }
  #app-inner { display: flex; flex: 1; overflow: hidden; }

  #mobile-bar { display: none; align-items: center; gap: 12px; background: var(--navy); padding: 14px 18px; flex-shrink: 0; z-index: 100; }
  #mobile-bar .mb-logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: #fff; flex: 1; }
  #mobile-status { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
  .hamburger { background: none; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .hamburger span { display: block; width: 22px; height: 2px; background: rgba(255,255,255,.85); border-radius: 2px; transition: all .22s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  #sb-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 199; backdrop-filter: blur(2px); }
  #sb-overlay.active { display: block; }

  #sidebar { width: 240px; min-width: 240px; background: var(--navy); display: flex; flex-direction: column; overflow: hidden; transition: transform .25s ease; z-index: 200; }
  .sb-brand { padding: 28px 24px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sb-logo { font-family: 'DM Serif Display', serif; font-size: 1.7rem; color: #fff; line-height: 1; display: flex; align-items: center; gap: 10px; }
  .sb-logo-icon { width: 38px; height: 38px; background: rgba(255,255,255,.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
  .sb-tagline { font-size: 0.72rem; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .1em; margin-top: 6px; }
  .sb-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .sb-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-sm); cursor: pointer; transition: background .15s; color: rgba(255,255,255,.65); font-size: 1rem; font-weight: 500; user-select: none; border: none; background: none; width: 100%; text-align: left; }
  .sb-item:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); }
  .sb-item.active { background: rgba(37,99,235,.35); color: #fff; }
  .sb-item-icon { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; }
  .sb-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); font-size: 0.9rem; color: rgba(255,255,255,.3); display: flex; align-items: center; gap: 8px; }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  #main { flex: 1; overflow-y: auto; min-width: 0; }
  .page { max-width: 920px; margin: 0 auto; padding: 36px 32px 64px; }

  h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--navy); line-height: 1.2; margin-bottom: 6px; }
  h2 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--navy); line-height: 1.3; }
  .page-sub { color: var(--ink2); font-size: 0.92rem; margin-bottom: 28px; }

  .hero { background: var(--navy); border-radius: var(--r); padding: 40px 40px 36px; margin-bottom: 20px; position: relative; overflow: hidden; }
  .hero::after { content: '🩺'; position: absolute; right: 36px; top: 50%; transform: translateY(-50%); font-size: 5.5rem; opacity: .06; }
  .hero h1 { color: #fff; font-size: 2.1rem; margin-bottom: 10px; }
  .hero p { color: rgba(147,197,253,.85); font-size: 0.92rem; max-width: 480px; line-height: 1.7; }
  .hero-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .hero-pill { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 5px 14px; color: rgba(255,255,255,.85); font-size: 0.78rem; font-weight: 500; }
  .hero-metrics { display: flex; gap: 0; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: var(--r-sm); margin-top: 24px; overflow: hidden; }
  .hero-metric { flex: 1; padding: 12px 16px; border-right: 1px solid rgba(255,255,255,.08); }
  .hero-metric:last-child { border-right: none; }
  .hero-metric-val { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: #fff; line-height: 1; }
  .hero-metric-lbl { font-size: 0.63rem; text-transform: uppercase; letter-spacing: .09em; color: rgba(255,255,255,.4); margin-top: 3px; }
  .hero-metric-val.live { color: #4ade80; }
  .hero-metric-val.warn { color: #fbbf24; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .card-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
  .card-title { font-weight: 600; font-size: 0.95rem; color: var(--ink); }
  .card-sub { font-size: 0.78rem; color: var(--ink3); margin-top: 2px; }

  .status-bar { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 0.78rem; font-weight: 500; color: var(--ink2); margin-bottom: 24px; box-shadow: var(--shadow); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.65;transform:scale(1.2)} }

  .section-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #111827; margin-bottom: 12px; margin-top: 24px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .form-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .form-grid-2 { grid-template-columns: repeat(2,1fr); }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); }
  input[type="text"], input[type="number"], select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm); font-family: 'DM Mono', monospace; font-size: 0.88rem; font-weight: 500; background: var(--surface2); color: var(--ink); transition: border .15s, box-shadow .15s; outline: none; width: 100%; }
  input:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  input::placeholder { color: var(--ink3); font-size: 0.82rem; font-weight: 400; }

  .tabs { display: flex; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; margin-bottom: 20px; width: fit-content; }
  .tab { padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.84rem; font-weight: 500; color: var(--ink2); transition: all .15s; border: none; background: none; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--surface); color: var(--navy); font-weight: 600; box-shadow: var(--shadow); }

  .upload-zone { border: 2px dashed var(--border2); border-radius: var(--r); padding: 36px 24px; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface2); }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .upload-zone input { display: none; }
  .upload-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .upload-label { font-size: 0.9rem; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .upload-sub { font-size: 0.78rem; color: var(--ink3); }
  .upload-link { color: var(--accent); text-decoration: underline; }
  .file-ok { display: flex; align-items: center; gap: 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--r-sm); padding: 12px 16px; font-size: 0.86rem; color: var(--green); font-weight: 500; margin-top: 12px; }
  .file-ok-name { font-weight: 600; }
  .file-ok-meta { font-size: 0.75rem; opacity: .75; font-weight: 400; }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 22px; border-radius: var(--r-sm); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all .15s; border: 1.5px solid transparent; text-decoration: none; }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px rgba(37,99,235,.25); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface); color: var(--navy); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
  .counter { display: inline-flex; align-items: center; gap: 5px; background: var(--navy); color: #fff; border-radius: 16px; padding: 3px 12px; font-size: 0.76rem; font-weight: 600; }

  .info-banner { display: flex; align-items: flex-start; gap: 10px; border-radius: var(--r-sm); padding: 13px 16px; font-size: 0.84rem; margin-bottom: 18px; line-height: 1.55; }
  .info-blue { background: var(--accent-soft); border: 1px solid #bfdbfe; color: #1e40af; }
  .info-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); }
  .info-red { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
  .info-green { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; margin-bottom: 20px; box-shadow: var(--shadow); border-left-width: 4px; }
  .result-positive { border-left-color: #ef4444; }
  .result-negative { border-left-color: #22c55e; }
  .result-skipped  { border-left-color: #94a3b8; }
  .result-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .result-condition { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink3); margin-bottom: 6px; }
  .result-label { font-family: 'DM Serif Display', serif; font-size: 1.6rem; line-height: 1.2; }
  .result-conf { text-align: right; }
  .result-conf-num { font-family: 'DM Serif Display', serif; font-size: 2.2rem; line-height: 1; }
  .result-conf-lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink3); margin-top: 2px; }
  .conf-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 12px 0 20px; overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 2px; transition: width .8s cubic-bezier(.4,0,.2,1); }

  .latency-badge { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 3px 10px; font-size: 0.7rem; font-weight: 600; color: #475569; font-family: 'DM Mono', monospace; }
  .latency-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; }

  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 12px; font-size: 0.68rem; font-weight: 700; letter-spacing: .04em; }
  .badge-high { background: #fee2e2; color: #b91c1c; }
  .badge-low { background: #fff7ed; color: #c2410c; }
  .badge-normal { background: #dcfce7; color: #166534; }
  .badge-unknown { background: #f1f5f9; color: #64748b; }

  .imp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .imp-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 16px 14px; position: relative; }
  .imp-rank-pill { position: absolute; top: 10px; right: 10px; font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
  .imp-card-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink3); margin-bottom: 6px; }
  .imp-card-name { font-weight: 700; font-size: 0.92rem; color: var(--navy); margin-bottom: 5px; line-height: 1.3; }
  .imp-card-status { font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
  .imp-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .imp-bar { height: 100%; border-radius: 2px; transition: width .9s cubic-bezier(.4,0,.2,1); }
  .imp-why { font-size: 0.74rem; color: var(--ink2); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 8px; }

  .accordion { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; margin-top: 10px; }
  .acc-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; background: var(--surface2); user-select: none; transition: background .15s; }
  .acc-header:hover { background: #ededea; }
  .acc-header-left { display: flex; align-items: center; gap: 9px; font-size: 0.88rem; font-weight: 600; color: var(--ink2); }
  .acc-chevron { font-size: 0.72rem; color: var(--ink3); transition: transform .2s; }
  .accordion.open .acc-chevron { transform: rotate(180deg); }
  .accordion.open .acc-header { background: #ededea; }
  .acc-body { display: none; padding: 18px; border-top: 1px solid var(--border); }
  .accordion.open .acc-body { display: block; }

  .thumb-row { display: flex; gap: 10px; margin-bottom: 2px; }
  .thumb-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--r-sm); border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--ink2); transition: all .15s; font-family: 'DM Sans', sans-serif; }
  .thumb-btn:hover { border-color: var(--border2); }
  .thumb-btn.up.sel { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
  .thumb-btn.down.sel { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .fb-options-lbl { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 14px 0 8px; }
  .fb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .fb-chip { padding: 7px 15px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 0.8rem; font-weight: 500; color: var(--ink2); cursor: pointer; transition: all .15s; font-family: 'DM Sans', sans-serif; }
  .fb-chip:hover { border-color: var(--accent); color: var(--accent); }
  .fb-chip.sel { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .fb-done { display: flex; align-items: center; gap: 8px; color: var(--green); font-size: 0.86rem; font-weight: 600; padding: 4px 0; }

  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--navy); line-height: 1; margin-bottom: 4px; }
  .stat-lbl { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); }

  .pipeline-live-badge { display: flex; align-items: center; gap: 6px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 20px; padding: 5px 12px; font-size: 0.75rem; font-weight: 700; color: #166534; }

  .pipeline-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
  .pm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .pm-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
  .pm-card.green::before { background: #22c55e; }
  .pm-card.blue::before { background: #3b82f6; }
  .pm-card.amber::before { background: #f59e0b; }
  .pm-card.red::before { background: #ef4444; }
  .pm-card.purple::before { background: #8b5cf6; }
  .pm-card.teal::before { background: #0d9488; }
  .pm-num { font-family: 'DM Serif Display', serif; font-size: 1.7rem; color: var(--navy); line-height: 1; margin-bottom: 3px; }
  .pm-lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink3); }
  .pm-sub { font-size: 0.72rem; color: var(--ink2); margin-top: 4px; }
  .pm-trend { font-size: 0.68rem; font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 10px; }
  .pm-trend.good { background: #dcfce7; color: #166534; }
  .pm-trend.warn { background: #fffbeb; color: #92400e; }
  .pm-trend.info { background: #eff6ff; color: #1e40af; }

  .dag-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 36px 28px 30px; margin-bottom: 24px; box-shadow: var(--shadow); overflow: visible; }
  .dag-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .dag-header-left { flex: 1; }
  .dag-title { font-weight: 700; font-size: 1.05rem; color: var(--navy); margin-bottom: 4px; }
  .dag-subtitle { font-size: 0.88rem; color: var(--ink2); line-height: 1.6; }
  .dag-flow-wrap { overflow-x: auto; padding-bottom: 4px; }
  .dag-row { display: flex; align-items: center; gap: 0; min-width: fit-content; }
  .dag-parallel-group { display: flex; flex-direction: column; gap: 18px; position: relative; }
  .dag-parallel-group::before { content:''; position:absolute; left:-1px; top:26px; bottom:26px; width:2px; background: var(--border); border-radius:2px; }
  .dag-parallel-group::after { content:''; position:absolute; right:-1px; top:26px; bottom:26px; width:2px; background: var(--border); border-radius:2px; }

  .dag-node { position: relative; }
  .dag-node-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 110px; height: 76px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; transition: all .2s; background: none; font-family: 'DM Sans', sans-serif; gap: 4px; position: relative; }
  .dag-node-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .dag-node-btn.success { background: #f0fdf4; border-color: #86efac; }
  .dag-node-btn.success:hover { border-color: #4ade80; }
  .dag-node-btn.running { background: #eff6ff; border-color: #93c5fd; animation: dag-pulse 1.5s infinite; }
  .dag-node-btn.pending { background: var(--surface2); border-color: var(--border2); }
  .dag-node-btn.failed  { background: #fef2f2; border-color: #fca5a5; }
  .dag-node-btn.active-selected { box-shadow: 0 0 0 3px rgba(37,99,235,.25) !important; border-color: var(--accent) !important; }
  @keyframes dag-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.3)} 50%{box-shadow:0 0 0 8px rgba(59,130,246,0)} }
  .dag-node-icon { font-size: 1.1rem; line-height: 1; }
  .dag-node-lbl { font-size: 0.67rem; font-weight: 700; color: var(--ink2); text-align: center; line-height: 1.2; max-width: 82px; }
  .dag-node-time { font-size: 0.6rem; color: var(--ink3); font-family: 'DM Mono', monospace; margin-top: 5px; text-align: center; }
  .dag-node-dot { position:absolute; top:-4px; right:-4px; width:10px; height:10px; border-radius:50%; border:2px solid #fff; }
  .dag-node-dot.success { background:#22c55e; }
  .dag-node-dot.running { background:#3b82f6; animation: pulse 1.2s infinite; }
  .dag-node-dot.pending { background:#94a3b8; }
  .dag-node-dot.failed  { background:#ef4444; }

  .dag-arrow { display: flex; align-items: center; padding: 0 6px; flex-shrink: 0; }

<script>
const BACKEND = (window.BACKEND_URL||'http://localhost:8000').replace(/\/$/,'');
const AIRFLOW = window.AIRFLOW_URL||'http://100.65.77.104:8080';
const MLFLOW  = window.MLFLOW_URL ||'http://localhost:5000';
const GRAFANA = window.GRAFANA_URL||'http://localhost:3001';

const state = {
  page:'home', backendReady:false, modelsLoaded:[],
  result:null, age:40, sex:'M',
  activeTab:'pdf', uploadedFile:null, manualFields:{},
  loading:false, error:null,
  feedback:{},
  liveMetrics: {
    ckdLatency: 35, thyLatency: 29,
    ckdF1: 1, thyF1: 0.69,
    totalPreds: 0, pendingFeedback: 0,
    uptime: 0,
    memUsedMb: 312,
    memTotalMb: 512,
    cpuPercent: 18,
    modelSizeCkd: 4.2,
    modelSizeThy: 3.8,
  },
  pipelineStats: null,
  runLog: [],
  inferenceLog: [],
  lastInferenceMs: null,
  dagSelectedNode: null,
  analysisMode: null,
  runLogLoaded: false,
};

// ════════════════════════════════════════════════════════
//  SPOTLIGHT TOUR
//  Shown on every page load. Steps point at real DOM IDs.
//  Add id="" attributes to the elements you want to spotlight.
// ════════════════════════════════════════════════════════

const TOUR_STEPS = [
  {
    target: '.hero',
    title: 'Your Blood Test Dashboard',
    desc: 'This hero panel shows live model performance — inference latency and F1 scores update every 30 seconds from the backend.',
    badge: 'Overview',
    position: 'below',
  },
  {
    target: '#tour-details-anchor',
    title: 'Enter Your Details',
    desc: 'Start here — enter your age and biological sex. These calibrate the model\'s reference ranges for more accurate predictions.',
    badge: 'Step 1',
    position: 'below',
  },
  {
    target: '#tour-input-anchor',
    title: 'Two Ways to Add Data',
    desc: 'Upload a PDF blood report and values are extracted automatically via OCR, or switch to "Enter Manually" to type them in yourself.',
    badge: 'Step 2',
    position: 'below',
  },
  {
    target: '#nav',
    title: 'Navigate the App',
    desc: 'Use the sidebar to switch pages. Results shows your analysis, Pipeline shows live MLOps metrics, and About explains the models.',
    badge: 'Navigation',
    position: 'right',
  },
  {
    target: '#sb-footer-area',
    title: 'Backend Status',
    desc: 'Green dot = all models loaded and ready. If it\'s red, the FastAPI backend is offline — analysis won\'t work until it\'s back.',
    badge: 'Status',
    position: 'above',
  },
  {
    target: '.hero-metrics',
    title: 'Live Model Metrics',
    desc: 'Inference latency (ms) and F1 scores shown here are polled from the running backend — not hardcoded. Watch them update.',
    badge: 'Live data',
    position: 'above',
  },
];

let tourStep = 0;
let tourActive = false;

function tourStart() {
  tourActive = true;
  tourStep = 0;
  document.getElementById('tour-overlay').classList.add('active');
  _tourRender();
}

function tourSkip() {
  tourActive = false;
  document.getElementById('tour-overlay').classList.remove('active');
  document.getElementById('tour-spotlight').style.cssText = '';
  document.getElementById('tour-arrow-svg').style.display = 'none';
}

function tourNext() {
  tourStep++;
  if (tourStep >= TOUR_STEPS.length) {
    tourSkip();
    return;
  }
  _tourRender();
}

function tourHandleBackdropClick() {
  // Clicking outside the card skips to next step (don't close entirely)
  tourNext();
}

function _tourRender() {
  const step = TOUR_STEPS[tourStep];
  const total = TOUR_STEPS.length;

  // Update card text
  document.getElementById('tour-badge').textContent = step.badge + ' · ' + (tourStep + 1) + ' / ' + total;
  document.getElementById('tour-title').textContent = step.title;
  document.getElementById('tour-desc').textContent = step.desc;

  // Update next button label
  const nextBtn = document.getElementById('tour-next-btn');
  nextBtn.textContent = tourStep === total - 1 ? '✓ Done' : 'Next →';

  // Dots
  const dotsEl = document.getElementById('tour-dots');
  dotsEl.innerHTML = Array.from({length: total}, (_, i) =>
    `<div class="tour-dot ${i === tourStep ? 'active' : ''}"></div>`
  ).join('');

  // Find target element
  const targetEl = document.querySelector(step.target);
  if (!targetEl) {
    // If element not found (e.g. not rendered yet), skip this step
    tourStep++;
    if (tourStep < total) _tourRender();
    else tourSkip();
    return;
  }

  // Position spotlight
  const rect = targetEl.getBoundingClientRect();
  const PAD = 8;
  const spotlight = document.getElementById('tour-spotlight');
  spotlight.style.left = (rect.left - PAD) + 'px';
  spotlight.style.top = (rect.top - PAD) + 'px';
  spotlight.style.width = (rect.width + PAD * 2) + 'px';
  spotlight.style.height = (rect.height + PAD * 2) + 'px';

  // Scroll target into view if needed
  targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });

  // Position tooltip card
  const card = document.getElementById('tour-card');
  const cardW = 300;
  const cardH = 200; // estimate
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const margin = 18;

  let cx, cy;

  if (step.position === 'below') {
    cx = Math.min(Math.max(rect.left + rect.width / 2 - cardW / 2, margin), vw - cardW - margin);
    cy = rect.bottom + PAD + margin;
    if (cy + cardH > vh) cy = rect.top - PAD - margin - cardH;
  } else if (step.position === 'above') {
    cx = Math.min(Math.max(rect.left + rect.width / 2 - cardW / 2, margin), vw - cardW - margin);
    cy = rect.top - PAD - margin - cardH;
    if (cy < margin) cy = rect.bottom + PAD + margin;
  } else if (step.position === 'right') {
    cx = rect.right + PAD + margin;
    cy = Math.min(Math.max(rect.top + rect.height / 2 - cardH / 2, margin), vh - cardH - margin);
    if (cx + cardW > vw) cx = rect.left - PAD - margin - cardW;
  } else { // left
    cx = rect.left - PAD - margin - cardW;
    cy = Math.min(Math.max(rect.top + rect.height / 2 - cardH / 2, margin), vh - cardH - margin);
    if (cx < margin) cx = rect.right + PAD + margin;
  }

  card.style.left = cx + 'px';
  card.style.top = cy + 'px';

  // Arrows removed — they were mis-rendering
  document.getElementById('tour-arrow-svg').style.display = 'none';
}

// Re-position on resize
window.addEventListener('resize', () => { if (tourActive && tourStep < TOUR_STEPS.length) _tourRender(); });

// Start tour after render settles
function initTour() {
  setTimeout(() => {
    tourStart();
  }, 600);
}



async function loadRunLog() {
  try {
    const data = await apiGet('/pipeline/runs');
    if (Array.isArray(data) && data.length > 0) {
      state.runLog = data;
    } else {
      state.runLog = [];
    }
  } catch(_) {
    state.runLog = [];
  }
  state.runLogLoaded = true;
  if (state.page === 'pipeline') {
    const tbody = document.getElementById('run-log-tbody');
    if (tbody) tbody.innerHTML = _runLogRows();
    const head = document.getElementById('run-log-summary');
    if (head) head.textContent = _runLogSummary();
  }
}

function _runLogRows() {
  if (!state.runLogLoaded) return `<tr><td colspan="6" style="text-align:center;color:var(--ink3);padding:20px">Loading runs…</td></tr>`;
  if (state.runLog.length === 0) return `<tr><td colspan="6" style="text-align:center;color:var(--ink3);padding:20px">No runs found — check that the backend /pipeline/runs endpoint is available and ~/logs/ exists.</td></tr>`;
  const statusStyle = s => s === 'success'
    ? 'color:#166534;background:#dcfce7;border-radius:10px;padding:2px 8px;font-size:.68rem;font-weight:700'
    : 'color:#991b1b;background:#fee2e2;border-radius:10px;padding:2px 8px;font-size:.68rem;font-weight:700';
  return state.runLog.map((r, i) => `<tr>
    <td class="mono">#${state.runLog.length - i}</td>
    <td style="font-size:.78rem;color:var(--ink2)">${r.dag}</td>
    <td><span style="${statusStyle(r.status)}">${r.status.toUpperCase()}</span></td>
    <td class="mono" style="font-size:.75rem">${r.start}</td>
    <td style="font-size:.75rem;color:var(--ink2)">${r.trigger}</td>
  </tr>`).join('');
}

function _runLogSummary() {
  const fails = state.runLog.filter(r => r.status === 'failed').length;
  const success = state.runLog.filter(r => r.status === 'success').length;
  return `${fails} failure${fails !== 1 ? 's' : ''} · ${success} success`;
}

// ── Nav ───────────────────────────────────────────────────────────────────────
const PAGES=[
  {id:'home',icon:'🏠',label:'Home'},
  {id:'results',icon:'📊',label:'Results'},
  {id:'pipeline',icon:'🔧',label:'Pipeline'},

// ── API ───────────────────────────────────────────────────────────────────────
async function apiGet(path){
  const r=await fetch(BACKEND+path,{signal:AbortSignal.timeout(8000)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function checkBackend(){
  try{
    const d=await apiGet('/ready');

async function analyseFile(){

const CKD_CHIPS=['Not CKD','Early stage CKD','Advanced CKD','Inconclusive'];
const THY_CHIPS=['Normal thyroid','Hypothyroid','Hyperthyroid','Borderline'];

async function setThumb(ck, thumb) {
  if(!state.feedback[ck]) state.feedback[ck]={thumb:null,chip:null,done:false};
  state.feedback[ck].thumb = thumb;
  state.feedback[ck].chip  = null;
  state.feedback[ck].done  = false;
  if (thumb === 'up') {
    await _doSubmitFb(ck);
  } else {
    _refreshFb(ck);
  }
}

async function setChip(ck, chip) {
  if(!state.feedback[ck]) state.feedback[ck]={thumb:null,chip:null,done:false};
  state.feedback[ck].chip = chip;
  await _doSubmitFb(ck);
}

async function _doSubmitFb(ck) {
  const fb = state.feedback[ck];
  const pred = state.result?.predictions?.[ck];
  const pid  = pred?.prediction_id;
  if (!fb || !pid || !pred) { state.feedback[ck].done = true; _refreshFb(ck); return; }
  const correct = fb.thumb === 'up' ? pred.class_name : (fb.chip || 'incorrect');
  try {
    await fetch(BACKEND+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prediction_id:pid,condition:ck,correct_label:correct})});
  } catch(_) {}
  state.feedback[ck].done = true;
  _refreshFb(ck);
}

function _refreshFb(ck){
  const el=document.getElementById(`fb-body-${ck}`);
  if(el) el.innerHTML=_fbHtml(ck);
}

function _fbHtml(ck){
  const fb=state.feedback[ck]||{};
  const pred=state.result?.predictions?.[ck];
  if(!pred) return '';
  if(fb.done) return `<div class="fb-done">✅ Thank you — your feedback helps improve the model overnight.</div>`;
  const chips=ck==='ckd'?CKD_CHIPS:THY_CHIPS;
  let h=`
    <p style="font-size:.82rem;color:var(--ink2);margin-bottom:14px">Was this result accurate? Tap once — it submits automatically and retrains the model overnight.</p>
    <div class="thumb-row">
      <button class="thumb-btn up ${fb.thumb==='up'?'sel':''}" onclick="setThumb('${ck}','up')">👍 Correct</button>
      <button class="thumb-btn down ${fb.thumb==='down'?'sel':''}" onclick="setThumb('${ck}','down')">👎 Incorrect</button>
    </div>`;
  if(fb.thumb==='down'){
    h+=`<div class="fb-options-lbl">What should the result be? (tap to submit)</div>
      <div class="fb-chips">${chips.map(c=>`<div class="fb-chip ${fb.chip===c?'sel':''}" onclick="setChip('${ck}','${c}')">${c}</div>`).join('')}</div>`;
  }
  return h;
}

function impCards(ck, flags, feats){
  const order=ck==='ckd'?CKD_ORDER:THY_ORDER;
  const rows=order.map((f,i)=>{const fl=flags[f]||'NORMAL';const base=1-(i/order.length)*.5;const boost=(fl==='HIGH'||fl==='LOW')?.38:0;return{f,fl,score:Math.min(base+boost,1)};}).filter(({f})=>f in feats||f in flags).sort((a,b)=>b.score-a.score).slice(0,3);
  if(!rows.length) return '';
  const max=rows[0].score;
  const rankStyle=[{bg:'#fffbeb',col:'#b45309',label:'1st'},{bg:'#f4f3ef',col:'#6b7280',label:'2nd'},{bg:'#fdf4ff',col:'#7c3aed',label:'3rd'}];
  return `<div class="imp-grid">${rows.map(({f,fl,score},i)=>{const pct=Math.round((score/max)*100);const col=fl==='HIGH'?'#ef4444':fl==='LOW'?'#f97316':'#22c55e';const stTxt=fl==='HIGH'?'Above normal':fl==='LOW'?'Below normal':'Within range';const rs=rankStyle[i];return`<div class="imp-card"><div class="imp-rank-pill" style="background:${rs.bg};color:${rs.col}">${rs.label}</div><div class="imp-card-label">Most influential</div><div class="imp-card-name">${FEAT_NAMES[f]||f}</div><div class="imp-card-status" style="color:${col}">${stTxt}</div><div class="imp-bar-wrap"><div class="imp-bar" style="width:${pct}%;background:${col}"></div></div><div class="imp-why">${FEAT_WHY[f]||'This marker contributed significantly to the prediction.'}</div></div>`;}).join('')}</div>`;
}

function renderResults(){
  const r=state.result;
  if(!r) return `<h1>Your Results</h1><p class="page-sub">No results yet.</p><div class="empty-state"><div class="empty-state-icon">📋</div><h3>No results yet</h3><p>Go to Home and submit a blood test report.</p><br><button class="btn btn-secondary" onclick="navigate('home')">← Go to Home</button></div>`;
  const feats = r.extracted_features || {};
  const flags = r.flags || {};
  const preds = r.predictions || {};
  const expls = r.explanations || {};
  const rid = r.report_id || '—';
  const isManual = state.analysisMode === 'manual';
  const totalExpected = CKD_ORDER.length + THY_ORDER.length;
  const manualFilled = Object.keys(state.manualFields || {}).length;
  const cov = isManual ? (totalExpected ? manualFilled / totalExpected : 0) : (r.ocr_coverage || 0);
  const coverageText = isManual
    ? `You entered ${manualFilled} of ${totalExpected} expected values. Add more values for a fuller analysis.`
    : `Only ${Math.round(cov * 100)}% of expected values found. Use manual entry to add more.`;
  const active=Object.keys(preds).filter(k=>!preds[k].skipped);
  const positives=active.filter(k=>isPositive(preds[k].class_name));
  const abnormal=Object.values(flags).filter(v=>v==='HIGH'||v==='LOW').length;
  const alert=positives.length>0
    ?`<div class="info-banner info-red"><span>⚠️</span><div><strong>Attention recommended</strong> — Possible issues with ${positives.map(k=>COND_LABELS[k]).join(' and ')}. Please see a doctor.</div></div>`
    :active.length>0?`<div class="info-banner info-green"><span>✅</span><div><strong>Looking good</strong> — No significant issues detected.</div></div>`:'';
  const latencyHtml = state.lastInferenceMs
    ? `<div style="margin-bottom:18px"><span class="latency-badge"><span class="latency-dot"></span>Analysis completed in ${state.lastInferenceMs}ms</span></div>`
    : '';
  return `
    <h1>Your Results</h1>
    <p class="page-sub">Full analysis for each condition below.</p>
    ${latencyHtml}
    ${alert}
    <div class="stats-grid">
      ${[[active.length,'Conditions Analysed','var(--navy)'],[positives.length,'Flags Raised','#dc2626'],[abnormal,'Abnormal Values','#d97706'],[Math.round(cov*100)+'%',isManual?'Values Entered':'Data Coverage','#0891b2']].map(([n,l,c])=>`<div class="stat-card"><div class="stat-num" style="color:${c}">${n}</div><div class="stat-lbl">${l}</div></div>`).join('')}
    </div>
    <p style="font-size:.74rem;color:var(--ink3);margin-bottom:22px">Report ID: <span class="mono" style="background:#f4f3ef;padding:2px 8px;border-radius:4px;font-size:.8rem">${rid}</span></p>
    ${['ckd','thyroid'].filter(k=>preds[k]).map(k=>{
      const pred=preds[k],label=pred.class_name||'Unknown',conf=pred.confidence||0;
      const skipped=pred.skipped||false;
      const title=COND_LABELS[k]||k,icon=COND_ICONS[k]||'🔬';
      const pos=isPositive(label);
      const cls=skipped?'result-skipped':(pos?'result-positive':'result-negative');
      const col=pos?'#ef4444':'#22c55e';
      const ic=impCards(k,flags,feats);
      const ex=expls[k]||'';
      const table=featureTableHtml(k,flags,feats);
      return `<div class="result-card ${cls}">
        <div class="result-head">
          <div>
            <div class="result-condition">${icon} ${title}</div>
            ${skipped
              ?`<div class="result-label" style="color:#94a3b8">Insufficient Data</div><p style="font-size:.84rem;color:var(--ink2);margin-top:8px">${coverageText}</p>`
              :`<div class="result-label" style="color:${col}">${label}</div>`}
          </div>
          ${!skipped?`<div class="result-conf"><div class="result-conf-num" style="color:${col}">${Math.round(conf*100)}%</div><div class="result-conf-lbl">Confidence</div></div>`:''}
        </div>
        ${!skipped?`
          ${confBar(conf,col)}
          ${table}
          ${ic?`<div class="accordion" id="acc-imp-${k}"><div class="acc-header" onclick="toggleAcc('acc-imp-${k}')"><div class="acc-header-left"><span>🔍</span> Key factors in this result</div><span class="acc-chevron">▼</span></div><div class="acc-body">${ic}</div></div>`:''}
          ${ex?`<div class="accordion" id="acc-ex-${k}"><div class="acc-header" onclick="toggleAcc('acc-ex-${k}')"><div class="acc-header-left"><span>📋</span> What this means</div><span class="acc-chevron">▼</span></div><div class="acc-body"><div style="font-size:.88rem;color:var(--ink2);line-height:1.8">${ex}</div></div></div>`:''}
          <div class="accordion open" id="acc-fb-${k}">
            <div class="acc-header" onclick="toggleAcc('acc-fb-${k}')"><div class="acc-header-left"><span>💬</span> Was this result correct?</div><span class="acc-chevron">▼</span></div>
            <div class="acc-body" id="fb-body-${k}">${_fbHtml(k)}</div>
          </div>
        `:''}
      </div>`;
    }).join('')}
    <div style="margin-top:24px"><button class="btn btn-secondary" onclick="newAnalysis()">← New Analysis</button></div>`;
}

// ── Event handlers ────────────────────────────────────────────────────────────
function switchTab(t){state.activeTab=t;render();}
function handleFile(e){const f=e.target.files[0];if(f&&f.type==='application/pdf'){state.uploadedFile=f;render();}}
function handleDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('dragover');const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf'){state.uploadedFile=f;render();}}
function updateField(k, v) {
  const n = parseFloat(v);
  if (v.trim() === '' || isNaN(n)) {
    delete state.manualFields[k];
  } else {
    state.manualFields[k] = n;
  }
  const filled = Object.keys(state.manualFields).length;
  const countEl = document.getElementById('manual-count');
  const hintEl  = document.getElementById('manual-hint');
  const btn     = document.getElementById('manual-analyse-btn');
  if (countEl) { countEl.style.display = filled > 0 ? 'inline-flex' : 'none'; countEl.textContent = `✓ ${filled} value${filled === 1 ? '' : 's'} entered`; }
  if (hintEl)  { hintEl.style.display = filled > 0 ? 'none' : 'inline'; }
  if (btn)     { btn.disabled = filled === 0 || state.loading; }
}
function newAnalysis(){state.result=null;state.uploadedFile=null;state.manualFields={};state.error=null;navigate('home');}

}
